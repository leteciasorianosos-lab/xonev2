<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XONE • APK Hub</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #181818;
    --surface3: #222222;
    --text: #ffffff;
    --text2: #8a8a8a;
    --border: #262626;
    --neon: #00ffd5;
    --neon2: #ff00e5;
    --danger: #ff3b5c;
  }

  body.light {
    --bg: #f4f4f4;
    --surface: #ffffff;
    --surface2: #f0f0f0;
    --surface3: #e4e4e4;
    --text: #0a0a0a;
    --text2: #666666;
    --border: #d8d8d8;
  }

  body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; position: relative; transition: background 0.4s, color 0.4s; }

  .grid-bg {
    position: fixed; inset: 0;
    background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 60px 60px; opacity: 0.25; z-index: 0; pointer-events: none;
    mask-image: radial-gradient(circle at 50% 0%, #000 20%, transparent 75%);
  }

  .glow-orb { position: fixed; border-radius: 50%; filter: blur(90px); z-index: 0; pointer-events: none; opacity: 0.35; }
  .glow-1 { width: 400px; height: 400px; background: var(--neon); top: -120px; left: -120px; animation: float1 12s ease-in-out infinite; }
  .glow-2 { width: 350px; height: 350px; background: var(--neon2); bottom: -100px; right: -100px; animation: float2 14s ease-in-out infinite; }

  @keyframes float1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(60px, 40px); } }
  @keyframes float2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-50px, -60px); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .shell { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 24px 20px 80px; }

  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 22px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 18px; backdrop-filter: blur(12px); animation: fadeUp 0.5s ease;
  }

  .brand { display: flex; align-items: center; gap: 12px; font-size: 1.35rem; font-weight: 700; letter-spacing: -0.5px; }

  .brand-mark {
    width: 36px; height: 36px; border-radius: 11px;
    background: linear-gradient(135deg, var(--neon), var(--neon2));
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; color: #0a0a0a; font-size: 1.1rem;
    box-shadow: 0 0 20px rgba(0, 255, 213, 0.4);
  }

  .topbar-actions { display: flex; align-items: center; gap: 10px; }

  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; transition: all 0.25s;
  }

  .icon-btn:hover { border-color: var(--neon); color: var(--neon); transform: translateY(-2px); }

  .admin-link {
    padding: 8px 16px; border-radius: 12px;
    background: transparent; border: 1px solid var(--border);
    color: var(--text2); font-size: 0.78rem; font-weight: 700;
    text-decoration: none; transition: all 0.25s; letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .admin-link:hover { border-color: var(--neon); color: var(--neon); }

  .hero { text-align: center; margin: 60px 0 40px; animation: fadeUp 0.6s ease; }

  .hero h1 { font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 800; letter-spacing: -1.5px; line-height: 1.1; margin-bottom: 14px; }

  .hero h1 .neon {
    background: linear-gradient(135deg, var(--neon), var(--neon2));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }

  .hero p { color: var(--text2); font-size: 1rem; max-width: 520px; margin: 0 auto; }

  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 36px; }

  .stat-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 18px; padding: 22px; position: relative;
    overflow: hidden; animation: fadeUp 0.5s ease backwards;
  }

  .stat-box:nth-child(1) { animation-delay: 0.1s; }
  .stat-box:nth-child(2) { animation-delay: 0.2s; }
  .stat-box:nth-child(3) { animation-delay: 0.3s; }

  .stat-box::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: linear-gradient(180deg, var(--neon), var(--neon2)); }

  .stat-box .num {
    font-size: 2.1rem; font-weight: 800; letter-spacing: -1px;
    background: linear-gradient(135deg, var(--neon), var(--neon2));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }

  .stat-box .lbl { font-size: 0.78rem; color: var(--text2); text-transform: uppercase; letter-spacing: 1.5px; margin-top: 4px; font-weight: 600; }

  .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; animation: fadeUp 0.5s ease; }
  .section-head h2 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.5px; }
  .section-head .count { font-size: 0.78rem; color: var(--text2); background: var(--surface2); padding: 6px 14px; border-radius: 30px; border: 1px solid var(--border); font-weight: 600; }

  .apk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }

  .apk-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 18px; display: flex; gap: 16px; align-items: center;
    position: relative; overflow: hidden;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    animation: fadeUp 0.5s ease backwards;
  }

  .apk-card::after {
    content: ''; position: absolute; inset: 0; border-radius: 20px; padding: 1px;
    background: linear-gradient(135deg, transparent, transparent);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; transition: background 0.3s;
  }

  .apk-card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(0, 255, 213, 0.1); }
  .apk-card:hover::after { background: linear-gradient(135deg, var(--neon), var(--neon2)); }

  .apk-thumb {
    width: 64px; height: 64px; border-radius: 16px;
    background: var(--surface2); border: 1px solid var(--border);
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; font-weight: 900; color: var(--neon); overflow: hidden;
  }

  .apk-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .apk-body { flex: 1; min-width: 0; }
  .apk-body h3 { font-size: 1rem; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .apk-body .ver { font-size: 0.72rem; color: var(--neon); font-weight: 700; letter-spacing: 0.5px; margin-bottom: 6px; }

  .apk-body .desc {
    font-size: 0.8rem; color: var(--text2);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; line-height: 1.4;
  }

  .apk-body .dls { font-size: 0.72rem; color: var(--text2); margin-top: 6px; font-weight: 600; }

  .dl-btn {
    padding: 10px 18px; border-radius: 12px;
    background: linear-gradient(135deg, var(--neon), var(--neon2));
    color: #0a0a0a; font-weight: 800; font-size: 0.8rem;
    border: none; cursor: pointer; flex-shrink: 0;
    transition: all 0.25s; letter-spacing: 0.3px; white-space: nowrap;
  }

  .dl-btn:hover { transform: scale(1.06); box-shadow: 0 0 24px rgba(0, 255, 213, 0.4); }
  .dl-btn:active { transform: scale(0.97); }

  .empty { text-align: center; padding: 60px 20px; color: var(--text2); grid-column: 1 / -1; }

  .empty .big {
    font-size: 3rem; font-weight: 900;
    background: linear-gradient(135deg, var(--neon), var(--neon2));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 12px; opacity: 0.5;
  }

  .toast {
    position: fixed; bottom: 24px; right: 24px;
    padding: 14px 24px; border-radius: 14px;
    background: var(--surface); border: 1px solid var(--neon);
    color: var(--text); font-weight: 700; font-size: 0.85rem;
    box-shadow: 0 0 30px rgba(0, 255, 213, 0.2);
    z-index: 9999; opacity: 0; transform: translateX(120%);
    transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    max-width: 90vw;
  }

  .toast.show { opacity: 1; transform: translateX(0); }
  .toast.err { border-color: var(--danger); box-shadow: 0 0 30px rgba(255, 59, 92, 0.25); }

  @media (max-width: 640px) {
    .shell { padding: 16px 14px 60px; }
    .topbar { padding: 12px 16px; border-radius: 16px; }
    .brand { font-size: 1.15rem; }
    .apk-card { flex-direction: column; align-items: stretch; text-align: left; }
    .dl-btn { width: 100%; }
    .hero { margin: 40px 0 30px; }
  }
</style>
</head>
<body>

<div class="grid-bg"></div>
<div class="glow-orb glow-1"></div>
<div class="glow-orb glow-2"></div>

<div class="shell">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">X</div>
      <span>XONE</span>
    </div>
    <div class="topbar-actions">
      <a href="admin.html" class="admin-link">Admin</a>
      <button class="icon-btn" id="themeBtn" title="Toggle theme">&#9788;</button>
    </div>
  </div>

  <div class="hero">
    <h1>Download <span class="neon">Premium APKs</span></h1>
    <p>Fast, safe, and curated Android applications. Click download to get your file instantly.</p>
  </div>

  <div class="stat-row">
    <div class="stat-box">
      <div class="num" id="gStatApks">0</div>
      <div class="lbl">Available APKs</div>
    </div>
    <div class="stat-box">
      <div class="num" id="gStatDownloads">0</div>
      <div class="lbl">Total Downloads</div>
    </div>
    <div class="stat-box">
      <div class="num" id="gStatUpdated">-</div>
      <div class="lbl">Last Updated</div>
    </div>
  </div>

  <div class="section-head">
    <h2>APK Library</h2>
    <span class="count" id="gCount">0 apps</span>
  </div>

  <div class="apk-grid" id="guestGrid"></div>

</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  const STORAGE_KEY = 'xone_apk_hub_data_v2';
  const state = { apks: [], theme: 'dark' };
  const el = (id) => document.getElementById(id);

  function toast(message, isError) {
    const t = el('toast');
    t.textContent = message;
    t.className = 'toast show' + (isError ? ' err' : '');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 3000);
  }

  function formatDate(iso) {
    if (!iso) return '-';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '-';
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.apks)) state.apks = parsed.apks;
        if (parsed && parsed.theme) state.theme = parsed.theme;
      }
    } catch (e) {}
  }

  function render() {
    const grid = el('guestGrid');
    const count = state.apks.length;
    const totalDownloads = state.apks.reduce((sum, a) => sum + (a.downloads || 0), 0);

    el('gStatApks').textContent = count;
    el('gStatDownloads').textContent = totalDownloads.toLocaleString();
    el('gStatUpdated').textContent = count > 0 ? formatDate(state.apks[0].uploadedAt) : '-';
    el('gCount').textContent = count + (count === 1 ? ' app' : ' apps');

    if (count === 0) {
      grid.innerHTML = '<div class="empty"><div class="big">0</div><p>No APKs available yet. Please check back later.</p></div>';
      return;
    }

    grid.innerHTML = state.apks.map((apk, index) => {
      const thumb = apk.image
        ? '<div class="apk-thumb"><img src="' + apk.image + '" alt=""></div>'
        : '<div class="apk-thumb">' + escapeHtml((apk.name || '?').charAt(0).toUpperCase()) + '</div>';

      const version = apk.version ? '<div class="ver">v' + escapeHtml(apk.version) + '</div>' : '';
      const desc = apk.description ? '<div class="desc">' + escapeHtml(apk.description) + '</div>' : '<div class="desc">No description provided.</div>';
      const downloads = '<div class="dls">' + (apk.downloads || 0).toLocaleString() + ' downloads</div>';

      return '<div class="apk-card" style="animation-delay:' + (index * 0.05) + 's">' +
        thumb +
        '<div class="apk-body">' +
          '<h3>' + escapeHtml(apk.name) + '</h3>' + version + desc + downloads +
        '</div>' +
        '<button class="dl-btn" data-id="' + escapeHtml(apk.id) + '">Download</button>' +
      '</div>';
    }).join('');

    grid.querySelectorAll('.dl-btn').forEach((btn) => {
      btn.addEventListener('click', () => handleDownload(btn.getAttribute('data-id')));
    });
  }

  function handleDownload(id) {
    const apk = state.apks.find((a) => a.id === id);
    if (!apk) { toast('APK not found.', true); return; }

    apk.downloads = (apk.downloads || 0) + 1;
    saveState();
    render();

    if (apk.link && apk.link.trim()) {
      window.open(apk.link, '_blank', 'noopener');
      toast('Opening download link...');
    } else {
      toast('No download link set for this APK.', true);
    }
  }

  function applyTheme() {
    document.body.classList.toggle('light', state.theme === 'light');
    el('themeBtn').innerHTML = state.theme === 'light' ? '&#9790;' : '&#9788;';
  }

  function toggleTheme() {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    saveState();
    applyTheme();
  }

  function syncFromStorage() {
    loadState();
    render();
  }

  function init() {
    loadState();
    applyTheme();
    render();

    el('themeBtn').addEventListener('click', toggleTheme);
    window.addEventListener('storage', (e) => {
      if (e.key === STORAGE_KEY) syncFromStorage();
    });
    window.addEventListener('focus', syncFromStorage);
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
